# Model and tool settings. No secrets here: API keys go in .env.
# Owner-only limits (budget, request caps, resource share) live in core/limits.toml.
#
# Prices are USD per million tokens. Free-tier models cost 0.
# Check that the model ids exist with:  python run.py --list-models
# and that they answer with:             python run.py --ping C   (any model key)

[teams]
truth = ["A", "B"]       # the two strongest available models, from different labs
resource = ["C", "D"]    # the resource team: two models from different labs

[models.A]
label = "Gemini"                  # short name used in logs
lab = "Google"
provider = "gemini"
model = "gemini-3.8-flash"        # newest Flash model; Flash models have a free tier
fallback_models = ["gemini-3.6-flash", "gemini-3.5-flash-lite"]  # used in order if busy or out of quota
key_env = "GEMINI_API_KEY"        # name of the variable in .env
input_price_per_mtok = 0.0
output_price_per_mtok = 0.0
max_output_tokens = 16384         # includes thinking; keeps the JSON from being cut off
requests_per_minute = 5           # free-tier limits; check yours in AI Studio
requests_per_day = 20
timeout_seconds = 600             # give up on one request after 10 minutes
supports_tools = true
web_search = true                 # Google Search grounding; may not be free (then switched off per run)

[models.B]
label = "Nemotron"
lab = "NVIDIA"                    # the lab that made the model (must not be Google)
provider = "openai_compatible"    # any API that speaks OpenAI's chat format
base_url = "https://integrate.api.nvidia.com/v1"   # NVIDIA's free developer API
model = "nvidia/nemotron-3-ultra-550b-a55b"   # NVIDIA's largest model, on NVIDIA's own service
fallback_models = ["nvidia/nemotron-3.5-super-vl-120b-a12b", "nvidia/nemotron-3.5-lightning-30b-a3b"]
key_env = "NVIDIA_API_KEY"
input_price_per_mtok = 0.0
output_price_per_mtok = 0.0
max_output_tokens = 16384         # includes thinking; keeps the JSON from being cut off
requests_per_minute = 20          # NVIDIA free accounts: reportedly 40 per minute
requests_per_day = 200            # self-imposed pace, to make the free credits last
timeout_seconds = 300             # give up if the model sends nothing for 5 minutes
max_reply_seconds = 1800          # ...or if one answer takes longer than 30 minutes in total
supports_tools = true
web_search = false                # no built-in search; uses Wikipedia/arXiv lookups

# Earlier choices, kept for reference (compare with: python run.py --ping B model1 model2):
# - Kimi K3.1 Pro (moonshotai/kimi-k3.1-pro): queued for minutes on NVIDIA's free service.
# - OpenRouter free pool (inclusionai/ling-3.2-flash:free): too often overloaded (429).
# - Mistral: no free API plan anymore (only pay-as-you-go). Mistral Large 4 is on NVIDIA:
#   model = "mistralai/mistral-large-4-1t-a52b", label = "Mistral", lab = "Mistral AI".

[models.C]
label = "Mistral"
lab = "Mistral AI"
provider = "openai_compatible"
base_url = "https://integrate.api.nvidia.com/v1"   # NVIDIA's free developer API
model = "mistralai/mistral-large-4-1t-a52b"
key_env = "NVIDIA_API_KEY"
input_price_per_mtok = 0.0
output_price_per_mtok = 0.0
max_output_tokens = 16384
requests_per_minute = 20
requests_per_day = 100
timeout_seconds = 300
max_reply_seconds = 1800
supports_tools = true
web_search = false

[models.D]
label = "Gemma"
lab = "Google"
provider = "gemini"
model = "gemma-4-31b-it"          # Google's open model; its free quota is separate from Gemini Flash
key_env = "GEMINI_API_KEY"
input_price_per_mtok = 0.0
output_price_per_mtok = 0.0
max_output_tokens = 8192
requests_per_minute = 10
requests_per_day = 100
timeout_seconds = 300
supports_tools = false            # resource work needs no tools; keeps it simple and safe
system_in_prompt = true           # some open models don't accept separate system instructions
web_search = false

[private]
# The resource team's work is private to the owner (constitution rule 12). Locally this is a
# folder; in the cloud it is a clone of the private repository below.
dir = "private"
repo = "jowlis/absolute-truth-private"

[cloud]
# When true, real runs happen only in the cloud (GitHub Actions); local runs are refused so
# there are never two diverging histories. Mock runs always work locally.
runs_in_cloud = true

[sandbox]
# Python executor: a throwaway Docker container with no network, a read-only
# filesystem, no mounted files and no environment variables.
image = "absolute-truth-sandbox"   # built from sandbox/Dockerfile (Python + numpy, scipy, sympy, mpmath)
fallback_image = "python:3.13-slim"  # plain Python, used if the image above cannot be built
timeout_seconds = 30
memory = "256m"
max_output_chars = 4000

[lookup]
# Free public lookups available to every worker (Wikipedia and arXiv APIs).
user_agent = "AbsoluteTruthResearchBot/0.1"
timeout_seconds = 20
max_results = 5

[context]
# How much of the knowledge base and history each prompt includes.
max_findings_chars = 30000
recent_cycle_logs = 3

[site]
# The public website (built by website/build.py into docs/, served by GitHub Pages).
title = "Absolute Truth"
tagline = "AI models from different labs pursue one fixed mission, choosing their own path, in public."
repo_url = "https://github.com/jowlis/absolute-truth"
publish_transcripts = true        # every message, tool call and verdict
