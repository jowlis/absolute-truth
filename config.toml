# Model and tool settings. No secrets here: API keys go in .env.
# Owner-only limits (budget, request caps, resource share) live in core/limits.toml.
#
# Prices are USD per million tokens. Free-tier models cost 0.
# Check that the model ids exist with:  python run.py --list-models

[models.A]
label = "Gemini"                  # short name used in logs
lab = "Google"
provider = "gemini"
model = "gemini-3.8-flash"        # newest Flash model; Flash models have a free tier
fallback_models = ["gemini-3.6-flash", "gemini-3.5-flash-lite"]  # used in order if busy or out of quota
key_env = "GEMINI_API_KEY"        # name of the variable in .env
input_price_per_mtok = 0.0
output_price_per_mtok = 0.0
max_output_tokens = 8192
requests_per_minute = 5           # free-tier limits; check yours in AI Studio
requests_per_day = 20
timeout_seconds = 600             # give up on one request after 10 minutes
supports_tools = true
web_search = true                 # Gemini's built-in Google Search grounding

[models.B]
label = "Mistral"
lab = "Mistral AI"
provider = "openai_compatible"    # any API that speaks OpenAI's chat format
base_url = "https://api.mistral.ai/v1"
model = "mistral-large-latest"    # Mistral's strongest model; free on the Experiment plan
fallback_models = ["mistral-medium-latest", "mistral-small-latest"]
key_env = "MISTRAL_API_KEY"
input_price_per_mtok = 0.0
output_price_per_mtok = 0.0
max_output_tokens = 8192
requests_per_minute = 20          # Experiment plan: about 1 request per second
requests_per_day = 500
timeout_seconds = 300             # give up on one request after 5 minutes
supports_tools = true
web_search = false                # no built-in search; uses Wikipedia/arXiv lookups

# Earlier choice, kept for reference: OpenRouter's free pool was too often overloaded.
# base_url = "https://openrouter.ai/api/v1", model = "inclusionai/ling-3.2-flash:free",
# key_env = "OPENROUTER_API_KEY", requests_per_day = 50

[sandbox]
# Python executor: a throwaway Docker container with no network, a read-only
# filesystem, no mounted files and no environment variables.
image = "python:3.13-slim"
timeout_seconds = 30
memory = "256m"
max_output_chars = 4000

[lookup]
# Free public lookups available to every worker (Wikipedia and arXiv APIs).
user_agent = "AbsoluteTruthResearchBot/0.1"
timeout_seconds = 20
max_results = 5

[context]
# How much of the knowledge base and history each prompt includes.
max_findings_chars = 30000
recent_cycle_logs = 3
